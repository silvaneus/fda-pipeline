name: Update FDA Pipeline Report

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST, 10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pipeline 2.0 reads MJH articles from Sanity and keeps them in a local cache. Restoring it
      # means only new and edited articles are fetched; with no cache the first run backfills from 2024.
      - name: Restore MJH article cache
        uses: actions/cache@v4
        with:
          path: pipeline2/state/articles
          key: mjh-articles-${{ github.run_id }}
          restore-keys: mjh-articles-

      - name: Run pipeline
        run: node run-pipeline.js --force

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/ state/ pipeline2/state/
          git diff --staged --quiet || git commit -m "Update FDA pipeline report - $(date +'%Y-%m-%d')"
          git push
